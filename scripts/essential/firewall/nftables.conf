#!/sbin/nft --file
#
# Useful information:
#
# System ports: 0:1023
# User ports: 1024:49151
# Dynamic ports: 49152:65535
#
# To list the current configuration use the following command: `nft list ruleset`
#
# To see the logs of the filters, use `dmesg --color=always | less -r` and search by the '[NFTABLES]' pattern
#
# Site with useful information:
#
# https://wiki.nftables.org/wiki-nftables/index.php/Quick_reference-nftables_in_10_minutes
# https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/7/html/security_guide/chap-getting_started_with_nftables
# https://wiki.gentoo.org/wiki/Nftables
# https://wiki.archlinux.org/title/Nftables#Usage
# https://wiki.nftables.org/wiki-nftables/index.php/Main_Page
#
# Details about the packet flow in Nftables (very useful):
# https://thermalcircle.de/doku.php?id=blog:linux:nftables_packet_flow_netfilter_hooks_detail
#
# This is about Iptables, but the instructions can be adapted to use with Nftables:
# https://wiki.archlinux.org/title/simple_stateful_firewall
#
# Some examples can be found in these folders: '/usr/share/nftables/' and '/usr/share/doc/nftables/examples/'


# Remove old rules
flush ruleset

# Interfaces
define DOCKER_INTERFACES = { "docker0", "br-*", "veth*" }
define PODMAN_INTERFACES = { "podman", "cni-podman0" }
define K3S_INTERFACES = { "cni0", "flannel.*", "vxlan.*" }
define CONTAINER_INTERFACES = { $DOCKER_INTERFACES, $PODMAN_INTERFACES, $K3S_INTERFACES }
define LAN_INTERFACES = { "eth0", "eno*", "wlan0", "enp*", "wlp*" }
define WAN_INTERFACES = { "eth0", "eno*", "wlan0", "enp*", "wlp*", "wg0", "tun0" }
define WAN_ONLY_INTERFACES = { "wg0", "tun0" }
define LAN_V4 = 192.168.0.0/16
define LAN_V6 = fc00::/7

table inet my_nat_table {
	# Anti spoofing {{{

	set bogons_v4 {
		type ipv4_addr
		flags interval
		elements = {
			0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8,
			169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24,
			192.168.0.0/16, 198.18.0.0/15, 198.51.100.0/22,
			203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4
		}
	}

	set bogons_v6 {
		type ipv6_addr
		flags interval
		elements = {
			::/128, ::1/128, ::ffff:0:0/96, 100::/64,
			2001:db8::/32, 2002::/16, fc00::/7,
			fe80::/10, fec0::/10, ff00::/8
		}
	}

	chain spoof_protection {
		iifname lo return
		iifname $LAN_INTERFACES return

		# Dynamic Reverse Path filter
		fib saddr . iif oif missing jump drop_spoofed_packet

		# Static Bogon Filter
		ip saddr @bogons_v4 jump drop_spoofed_packet
		ip6 saddr @bogons_v6 jump drop_spoofed_packet
	}

	chain drop_spoofed_packet {
		limit rate 5/second log level alert prefix "[NFTABLES] IP blocked by spoof protection: "
		counter
		drop
	}

	# }}}

	chain prerouting {
		type filter hook prerouting priority filter

		# Drop invalid packets
		ct state invalid drop

		# Protection
		jump spoof_protection
	}

	chain postrouting {
		type nat hook postrouting priority srcnat

		# Masquerades the source address of a container packet to be the address of the "eth0" interface
		iifname $CONTAINER_INTERFACES oifname "eth0" masquerade
	}
}

table inet my_filter_table {
	# Deny lists {{{

	# IP of sources to drop the packets (IPV4 version)
	set denylist_ipv4 {
		type ipv4_addr
		flags timeout
		size 1000
		timeout 15m
		counter
	}

	# IP of sources to drop the packets (IPV6 version)
	set denylist_ipv6 {
		type ipv6_addr
		flags timeout
		size 1000
		timeout 15m
		counter
	}
	# }}}

	# DDoS chains {{{

	# LOG the data related to the current packet (can be accessed with `dmesg`) and drop the packet
	chain log_DDoS_and_drop {
		log level alert prefix "[NFTABLES] IP blocked by DDoS protection: "
		counter
		drop
	}

	# Apply a simple DDoS protection. Check if the source tries to initiate a lot of connections. If true, add it to a deny list and drop
	# the packets of this source
	chain DDoS_filter {
		# Drop the packets of the IP if it is in the deny list
		ip saddr @denylist_ipv4 jump log_DDoS_and_drop
		ip6 saddr @denylist_ipv6 jump log_DDoS_and_drop

		# Add a IP with a lot new connections (possibly a DDoS attack) to the deny list.
		#
		# Separate by IPV4 or IPV6 | only applies to 'new' and 'untracked' packets | applies if the IP has more than the limit of packet per
		# time, the burst option sets the size of the packet list before adding the IP to the deny list | the `add` command appends the IP to
		# the deny list
		meta nfproto ipv4 ct state { new, untracked } limit rate over 20/minute burst 10 packets add @denylist_ipv4 { ip saddr }
		meta nfproto ipv6 ct state { new, untracked } limit rate over 20/minute burst 10 packets add @denylist_ipv6 { ip6 saddr }
	}
	# }}}

	# Accept kdeconnect ports {{{
	chain accept_kdeconnect_dports {
		tcp dport { 1714-1764 } accept
		udp dport { 1714-1764 } accept
	}
	# }}}

	define icmpv4_types_to_accept = {
		echo-request, echo-reply,
		destination-unreachable,
		time-exceeded,
		parameter-problem
	}

	define icmpv6_types_to_accept = {
		echo-request, echo-reply,
		mld-listener-query, mld-listener-report, mld-listener-reduction, mld2-listener-report,
		nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert,
		destination-unreachable, packet-too-big, time-exceeded, parameter-problem
	}

	chain INPUT {
		type filter hook input priority 0
		policy drop

		# Allow loop back interfaces. Place on the top, so the user can run a local server and connect to it ever
		# if the firewall is enabled. Remember to disable ports that the server is listening so no one outside the machine
		# can connect to the server
		iifname lo accept

		# Accept already running already running connections
		ct state { established, related } accept

		# DDoS protection
		jump DDoS_filter

		# Allow ICMP
		icmp type $icmpv4_types_to_accept accept
		icmpv6 type $icmpv6_types_to_accept accept

		# Drop invalid packets
		# Some ICMPV6 packets are marked as invalid (I don't now why). This line should be placed after the ICMPV6 accept filters
		ct state invalid drop

		# DHCP (required to use dynamic IPs)
		udp sport 67 udp dport 68 accept
		udp sport 547 udp dport 546 accept

		# Enable kdeconnect ports
		jump accept_kdeconnect_dports

		# Fallback
		limit rate 5/second log level alert prefix "[NFTABLES] Try to establish new connection, but not allowed by firewall: "
		counter
		drop
	}

	chain OUTPUT {
		type filter hook output priority 0
		policy drop

		# Allow loop back interfaces. Place on the top, so the user can run a local server and connect to it ever
		# if the firewall is enabled. Remember to disable ports that the server is listening so no one outside the machine
		# can connect to the server
		oifname lo accept

		# Accept already running already running connections
		ct state { established,related } accept

		# Allow ICMP
		icmp type $icmpv4_types_to_accept accept
		icmpv6 type $icmpv6_types_to_accept accept

		# DHCP (required to use dynamic IPs)
		udp sport 68 udp dport 67 accept
		udp sport 546 udp dport 547 accept

		# Enables to send packets from user and dynamic ports
		tcp sport >1023 accept
		udp sport >1023 accept
	}

	chain FORWARD {
		type filter hook forward priority 0
		policy drop

		# Accept already running already running connections
		ct state { established, related } accept

		# Drop invalid packets
		ct state invalid drop

		# Accept docker to internet connections
		iifname $CONTAINER_INTERFACES oifname != $LAN_INTERFACES accept

		# Fallback
		limit rate 5/second log level alert prefix "[NFTABLES] Dropped FORWARD packet: "
		counter
		drop
	}
}

# Redirect HTTP ports to its fallback ports
table inet REDIRECT_DEVELOPMENT_PORTS {

	chain PREROUTING {
		type nat hook prerouting priority dstnat; policy accept;

		# Redirects external connections to the fallback ports

		# IPv4 LAN only (uncomment to enable)
		# ip saddr $LAN_V4 tcp dport 80  redirect to 8080
		# ip saddr $LAN_V4 tcp dport 443 redirect to 8443

		# IPv6 LAN only (uncomment to enable)
		# ip6 saddr $LAN_V6 tcp dport 80  redirect to 8080
		# ip6 saddr $LAN_V6 tcp dport 443 redirect to 8443
	}

	chain OUTPUT {
		type nat hook output priority -100; policy accept;

		# Localhost IPv4
		ip daddr 127.0.0.1 tcp dport 80  redirect to 8080
		ip daddr 127.0.0.1 tcp dport 443 redirect to 8443

		# Localhost IPv6
		ip6 daddr ::1 tcp dport 80  redirect to 8080
		ip6 daddr ::1 tcp dport 443 redirect to 8443
	}
}

# vi: ft=config
